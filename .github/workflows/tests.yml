name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test core
        run: python -m unittest discover -s tests -v
      - name: Compile
        run: python -m compileall -q main.py dfir_ia
      - name: Smoke test (sin IA ni DOCX)
        run: python main.py --input samples/hayabusa_demo.jsonl samples/security_snapshot.json --out salida_ci --no-docx
